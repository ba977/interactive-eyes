<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>العيون التفاعلية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:0;right:0;top:0;height:68vh;display:flex;align-items:center;justify-content:center}
#eyes{width:min(100vw,1000px);height:100%;max-height:100%}
#say{position:fixed;left:0;right:0;bottom:calc(11vh + env(safe-area-inset-bottom,0px));padding-left:clamp(84px,14vw,160px);padding-right:12px;
  text-align:center;direction:rtl;font-weight:800;font-size:clamp(30px,8vw,88px);line-height:1.25;
  opacity:0;transform:translateY(12px) scale(.96);transition:opacity .25s,transform .25s;pointer-events:none}
#say.on{opacity:1;transform:none}
#dots{display:none;justify-content:center;gap:.25em;direction:ltr;margin-top:.1em}
#say.dots #dots{display:flex}
#dots i{width:.28em;height:.28em;border-radius:50%;background:#fff;animation:dot 1.2s infinite ease-in-out}
#dots i:nth-child(2){animation-delay:.2s}#dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-.25em)}}
#bar{position:fixed;left:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:clamp(64px,11vw,128px);display:flex;flex-direction:column;
  border:4px solid #fff;border-left:0;border-radius:0 16px 16px 0;overflow:hidden;background:#000}
#bar button{height:clamp(64px,13vh,124px);padding:0;border:0;background:#000;color:#fff;font-size:clamp(34px,6.5vh,64px);line-height:1;
  cursor:pointer;transition:background .12s,transform .12s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#bar button+button{border-top:4px solid #fff}
#bar button.pressed{background:#333;transform:scale(.9)}
#bar button.on{background:#1d1d1d}
#bar button:focus-visible{outline:3px solid #ffe27a;outline-offset:-6px}
.spark{transform-box:fill-box;transform-origin:center;fill:#ffe27a;animation:pop .9s ease-out both}
@keyframes pop{0%{transform:scale(0) rotate(0);opacity:0}40%{opacity:1;transform:scale(1.3) rotate(45deg)}100%{transform:scale(0) rotate(90deg);opacity:0}}
#ring{transform-box:fill-box;transform-origin:center;opacity:0}
#ring.go{animation:ring 1.1s ease-out}
@keyframes ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(7);opacity:0}}
</style>
</head>
<body>
<div id="stage">
<svg id="eyes" viewBox="0 0 800 560" aria-label="عينان كرتونيتان">
  <defs>
    <clipPath id="cL"><path id="clipL"/></clipPath>
    <clipPath id="cR"><path id="clipR"/></clipPath>
  </defs>
  <circle id="ring" cx="400" cy="330" r="40" fill="none" stroke="#fff" stroke-width="3"/>
  <g id="eyeL"><path id="outL" fill="#000" stroke="#fff" stroke-width="15" stroke-linejoin="round"/><path id="inL" fill="#fff"/></g>
  <g id="eyeR"><path id="outR" fill="#000" stroke="#fff" stroke-width="15" stroke-linejoin="round"/><path id="inR" fill="#fff"/></g>
  <g clip-path="url(#cL)"><g id="pupL"><circle r="46" fill="#000"/><circle cx="-9" cy="-24" r="14" fill="#fff"/></g></g>
  <g clip-path="url(#cR)"><g id="pupR"><circle r="46" fill="#000"/><circle cx="-9" cy="-24" r="14" fill="#fff"/></g></g>
  <path id="browL" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <path id="browR" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
  <g id="sparks"></g>
</svg>
</div>
<div id="say"><span id="txt"></span><div id="dots"><i></i><i></i><i></i></div></div>
<div id="bar">
  <button data-act="hello" aria-label="تحية">👋</button>
  <button data-act="no" aria-label="لا">❌</button>
  <button data-act="yes" aria-label="ممتاز">✅</button>
  <button data-act="wait" aria-label="انتظر">🤏</button>
</div>
<script>
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';

/* Hand-drawn wobbly oval as a closed smooth path */
function blob(cx,cy,rx,ry,ph,amp){
  const n=18,p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,w=1+amp*(Math.sin(3*a+ph)*.6+Math.sin(5*a+ph*2)*.4);
    p.push([cx+Math.cos(a)*rx*w,cy+Math.sin(a)*ry*w]);}
  let d='M'+p[0][0]+','+p[0][1];
  for(let i=0;i<n;i++){
    const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
    d+='C'+(b[0]+(c[0]-a[0])/6)+','+(b[1]+(c[1]-a[1])/6)+' '+(c[0]-(e[0]-b[0])/6)+','+(c[1]-(e[1]-b[1])/6)+' '+c[0]+','+c[1];
  }
  return d+'Z';
}
const eyes=[{id:'L',cx:225,cy:330,ph:1.2,s:1},{id:'R',cx:575,cy:330,ph:3.4,s:-1}];
eyes.forEach(e=>{
  e.g=$('#eye'+e.id);e.pup=$('#pup'+e.id);e.brow=$('#brow'+e.id);
  $('#out'+e.id).setAttribute('d',blob(e.cx,e.cy,108,142,e.ph,.025));
  const inner=blob(e.cx,e.cy,86,120,e.ph+.7,.02);
  $('#in'+e.id).setAttribute('d',inner);$('#clip'+e.id).setAttribute('d',inner);
  e.brow.setAttribute('d',`M${e.cx-92*e.s},${e.cy-160} Q${e.cx-40*e.s},${e.cy-218} ${e.cx+42*e.s},${e.cy-206}`);
});

/* Eye state: current (S) eases toward target (T) */
const N={tx:0,ty:0,sx:1,sy:1,open:1,lx:0,ly:.35,ps:1,brow:0};
const S={...N},T={...N};
let ease=.16;
const go=(p,e=.16)=>{Object.assign(T,p);ease=e};
const rest=()=>go(N,.14);
function render(){
  const open=Math.max(.05,S.open);
  for(const e of eyes){
    e.g.setAttribute('transform',`translate(${e.cx+S.tx} ${e.cy+S.ty}) scale(${S.sx} ${S.sy*open}) translate(${-e.cx} ${-e.cy})`);
    e.pup.setAttribute('transform',`translate(${e.cx+S.tx+S.lx*38} ${e.cy+S.ty+S.ly*52*Math.min(1,open)}) scale(${S.ps*S.sx} ${S.ps*S.sy*open})`);
    e.brow.setAttribute('transform',`translate(${S.tx} ${S.ty-S.brow*30+(1-Math.min(1,open))*34})`);
  }
}
(function loop(){
  for(const k in S){const d=T[k]-S[k];S[k]=Math.abs(d)>.0005?S[k]+d*ease:T[k];}
  render();requestAnimationFrame(loop);
})();

/* Run control: every button press cancels the previous sequence */
let run=0,busy=false;
const sleep=(ms,id)=>new Promise(r=>setTimeout(()=>r(id===run),ms));
const btns=[...document.querySelectorAll('#bar button')];
function clearFX(){$('#sparks').innerHTML='';$('#ring').classList.remove('go');$('#say').classList.remove('on','dots')}
function begin(btn){
  run++;busy=true;
  if('speechSynthesis' in window)speechSynthesis.cancel();
  clearFX();btns.forEach(b=>b.classList.toggle('on',b===btn));
  return run;
}
function finish(id){
  if(id!==run)return;
  busy=false;clearFX();rest();btns.forEach(b=>b.classList.remove('on'));
}
function say(t,dots){$('#txt').textContent=t;$('#say').classList.toggle('dots',!!dots);$('#say').classList.add('on')}
function ring(){const r=$('#ring');r.classList.remove('go');r.getBoundingClientRect();r.classList.add('go')}
function sparkle(){
  const g=$('#sparks');g.innerHTML='';
  for(let i=0;i<12;i++){
    const e=eyes[i%2],a=Math.random()*Math.PI*2,d=130+Math.random()*90;
    const x=e.cx+Math.cos(a)*d*1.1,y=e.cy-20+Math.sin(a)*d*1.05,s=.6+Math.random()*.9;
    const grp=document.createElementNS(NS,'g');grp.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);
    const p=document.createElementNS(NS,'path');p.setAttribute('class','spark');
    p.setAttribute('d','M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4Z');
    p.style.animationDelay=(Math.random()*.5)+'s';grp.appendChild(p);g.appendChild(grp);
  }
}

/* Arabic speech: prefer ar-AE, then ar-SA, then any Arabic voice */
let voice=null;
function pickVoice(){
  const l=x=>x.lang.replace('_','-').toLowerCase(),v=speechSynthesis.getVoices();
  voice=v.find(x=>l(x)==='ar-ae')||v.find(x=>l(x)==='ar-sa')||v.find(x=>l(x).startsWith('ar'))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate,pitch,id,maxMs){
  return new Promise(res=>{
    setTimeout(res,maxMs);
    if(!('speechSynthesis' in window))return;
    setTimeout(()=>{
      if(id!==run)return res();
      try{const u=new SpeechSynthesisUtterance(text);
        u.lang=voice?voice.lang:'ar-AE';if(voice)u.voice=voice;
        u.rate=rate;u.pitch=pitch;u.onend=res;u.onerror=res;speechSynthesis.speak(u);}catch(_){res()}
    },70);
  });
}

/* Button sequences */
async function hello(id){
  say('مرحبا الساع!');ring();
  const sp=speak('مرحبا الساع!',.9,1.15,id,3800);
  go({open:1.1,sy:1.1,sx:1.05,lx:0,ly:0,ps:1.15,brow:1},.3);
  for(let i=0;i<2;i++){
    go({ty:-16},.3);if(!await sleep(200,id))return;
    go({ty:0},.3);if(!await sleep(230,id))return;
  }
  go({lx:-.4,ly:-.1},.2);if(!await sleep(260,id))return;
  go({lx:.4},.2);if(!await sleep(260,id))return;
  go({lx:0,ly:0},.2);
  await sp;if(!await sleep(500,id))return;
  finish(id);
}
async function no(id){
  say('لا، لا! اء اء!');
  const sp=speak('لا، لا! اء اء!',1.05,1.5,id,3800);
  go({brow:-.5,open:.9},.4);
  for(let i=0;i<6;i++){
    go({lx:i%2?1:-1,tx:i%2?12:-12,ly:0},.5);
    if(!await sleep(140,id))return;
  }
  go({lx:0,tx:0,ly:.3,open:.55,brow:-.8},.25);
  if(!await sleep(600,id))return;
  await sp;if(!await sleep(300,id))return;
  finish(id);
}
async function yes(id){
  say('ممتاز يا بطل!');sparkle();
  const sp=speak('ممتاز يا بطل!',.95,1.25,id,3800);
  go({open:1.12,sy:1.1,sx:1.05,lx:0,ly:0,brow:1,ps:1.1},.3);
  if(!await sleep(250,id))return;
  for(let i=0;i<2;i++){
    go({open:.3,ty:6,brow:.4},.45);if(!await sleep(140,id))return;
    go({open:1.12,ty:-18,brow:1},.4);if(!await sleep(220,id))return;
    go({ty:0},.3);if(!await sleep(220,id))return;
  }
  await sp;if(!await sleep(400,id))return;
  finish(id);
}
async function pleaseWait(id){
  say('انتظر قليلاً.',true);
  const sp=speak('انتظر قليلاً.',.8,1,id,3800);
  go({lx:-.7,ly:-.2,brow:.3},.08);if(!await sleep(600,id))return;
  go({open:.05},.07);if(!await sleep(650,id))return;
  go({open:1},.07);if(!await sleep(450,id))return;
  go({lx:.7,ly:-.3},.08);if(!await sleep(700,id))return;
  go({lx:0,ly:.5},.08);if(!await sleep(500,id))return;
  go({open:.05},.07);if(!await sleep(650,id))return;
  go({open:1,lx:-.3,ly:0},.07);
  await sp;if(!await sleep(500,id))return;
  finish(id);
}
const acts={hello,no,yes,wait:pleaseWait};
function trigger(btn){acts[btn.dataset.act](begin(btn))}
btns.forEach(b=>{
  b.addEventListener('click',()=>trigger(b));
  b.addEventListener('pointerdown',()=>b.classList.add('pressed'));
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('pressed')));
});
addEventListener('keydown',e=>{const b=btns[+e.key-1];if(b&&!e.repeat)trigger(b)});
addEventListener('contextmenu',e=>e.preventDefault());

/* Idle life: random blinks and glances when nothing is pressed */
function blink(){
  if(busy)return;
  go({open:.05},.5);
  setTimeout(()=>{if(!busy)go({open:1},.35)},120);
}
(function idle(){
  setTimeout(()=>{
    if(!busy){
      if(Math.random()<.4){
        go({lx:(Math.random()*1.6-.8),ly:Math.random()*.6},.14);
        setTimeout(()=>{if(!busy)go(N,.12)},800+Math.random()*600);
      }
      blink();
      if(Math.random()<.25)setTimeout(blink,260);
    }
    idle();
  },1400+Math.random()*3200);
})();
</script>
</body>
</html>
